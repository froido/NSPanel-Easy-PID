#####################################################################################################
#####                 NSPanel Easy - https://github.com/edwardtfn/NSPanel-Easy                  #####
#####################################################################################################
##### ESPHome Add-on for Climate control - PID Single (one setpoint, central heat/cool mode)    #####
##### PLEASE only make changes if it is necessary and also the required knowledge is available. #####
##### For normal use with the Blueprint, no changes are necessary.                              #####
#####################################################################################################
##### PI/PWM control for slow systems such as underfloor heating, with a single setpoint.       #####
##### - thermostat_embedded acts as a heat-only facade: one setpoint, modes off/heat. On the    #####
#####   panel this means "room on/off" plus the setpoint. It only switches the dummy relay 0.   #####
##### - The operating mode (heat or cool) is read from a Home Assistant entity, so it can be    #####
#####   switched centrally (e.g. together with the heat pump). It is stored in flash, so the    #####
#####   panel keeps regulating in the last mode while Home Assistant is unavailable.            #####
##### - Two internal PID controllers (heat/cool) follow the same setpoint; exactly one is       #####
#####   active. Both feed one slow PWM output on one relay (shared valve actuators).            #####
#####################################################################################################
##### ATTENTION: Do NOT combine with climate_heat, climate_cool, climate_dual or                #####
##### climate_pid_dual. The climate base is included by this file.                              #####
#####################################################################################################
---
substitutions:
  ##############################
  ## Change only in your      ##
  ## local yaml substitutions ##
  ##############################
  valve_relay: "1"                            # Relay switching the valve actuators (heating and cooling)
  pid_mode_entity: input_select.climate_mode  # HA entity holding the central operating mode
  pid_mode_heat_state: "Heat"                 # State of the mode entity that selects heating
  pid_mode_cool_state: "Cool"                 # State of the mode entity that selects cooling
  ### PID seed values (first boot only, afterwards the number entities in HA are the source) ###
  pid_kp: "0.3"                 # Proportional gain: output share per Kelvin of error (0.3 = 30 %/K)
  pid_ki: "0.00003"             # Compile-time default, overwritten at boot by ki = kp / (Tn * 60)
  pid_kd: "0.0"                 # Derivative term, not useful for slow systems
  pid_tn: "180"                 # Integral time Tn in minutes
  pid_deadband: "0.25"          # Deadband around the setpoint in Kelvin (also when temp_units is °F)
  pwm_period: "1200"            # PWM cycle time in seconds
  pid_starting_integral: "0.0"  # Integral term after boot (0.0..1.0), not persisted in flash
  pid_sync_interval: "10"       # Seconds between syncs thermostat -> PID controllers
  ### Entity names (override to keep existing entity IDs or to localize) ###
  pid_name_mode: "PID Operating mode"
  pid_name_heat_output: "PID Heat output"
  pid_name_cool_output: "PID Cool output"
  pid_name_heat_integral: "PID Heat integral"
  pid_name_cool_integral: "PID Cool integral"
  pid_name_kp: "PID kp"
  pid_name_tn: "PID Tn"
  pid_name_pwm_period: "PID PWM period"
  pid_name_deadband: "PID Deadband"
  pid_name_reset_integral: "PID Reset integral"
  temp_max: ${113 if TEMP_UNIT_IS_FAHRENHEIT else 45}
  TAG_ADDON_CLIMATE_PID: nspanel.addon.climate.pid

esphome:
  build_flags:
    - -D NSPANEL_EASY_ADDON_CLIMATE_HEAT  # Single setpoint UI on the display, as with the heat add-on
    - -D NSPANEL_EASY_ADDON_CLIMATE_PID

globals:
  - id: pid_cooling_mode  # Central operating mode: true = cool, false = heat
    type: bool
    restore_value: true
    initial_value: 'false'  # Must be quoted: ESPHome expects the C++ initializer as a string

text_sensor:
  - platform: homeassistant  # Central operating mode from Home Assistant
    id: pid_mode_from_ha
    entity_id: ${pid_mode_entity}
    internal: true
    on_value:
      - lambda: |-
          bool cooling;
          if (x == "${pid_mode_cool_state}") {
            cooling = true;
          } else if (x == "${pid_mode_heat_state}") {
            cooling = false;
          } else {
            ESP_LOGW("${TAG_ADDON_CLIMATE_PID}", "Unknown operating mode '%s' - ignored", x.c_str());
            return;
          }
          if (cooling == id(pid_cooling_mode)) return;
          ESP_LOGI("${TAG_ADDON_CLIMATE_PID}", "Operating mode changed: %s", cooling ? "cool" : "heat");
          id(pid_cooling_mode) = cooling;
          // Drop the integral terms, so nothing from the previous mode carries over
          pid_heat_embedded->reset_integral_term();
          pid_cool_embedded->reset_integral_term();
          id(pid_valve_pwm).set_level(0.0f);
      - script.execute: pid_sync
      - component.update: pid_mode_active

  - platform: template  # Active operating mode, for diagnostics in HA
    id: pid_mode_active
    name: ${pid_name_mode}
    icon: mdi:sun-snowflake-variant
    entity_category: diagnostic
    update_interval: 60s
    lambda: |-
      return std::string(id(pid_cooling_mode) ? "${pid_mode_cool_state}" : "${pid_mode_heat_state}");

climate:
  # Heat-only facade: without cool_action the thermostat stays single setpoint (no two-point mode)
  - id: !extend thermostat_embedded
    min_heating_off_time: 1s
    min_heating_run_time: 1s
    heat_deadband: ${heat_deadband} ${temp_units}
    heat_overrun: ${heat_overrun} ${temp_units}
    heat_action:
      - switch.turn_on: relay_0   # Dummy, the valve relay is driven by the PID controllers
    idle_action:
      - switch.turn_off: relay_0  # Dummy
    preset:
      - name: "Off"
        default_target_temperature_low: ${target_low} ${temp_units}
        mode: "off"
      - name: Home
        default_target_temperature_low: ${target_low} ${temp_units}
        mode: "heat"

  # Two internal controllers: the ESPHome PID climate has no direction per mode (heat mode with
  # both outputs would also cool), so heating and cooling use separate instances
  - platform: pid
    id: pid_heat_embedded
    name: PID Heat
    internal: true
    sensor: temp_nspanel
    default_target_temperature: 21  # Overwritten by the sync right after boot
    heat_output: pid_heat_out
    control_parameters:
      kp: ${pid_kp}
      ki: ${pid_ki}
      kd: ${pid_kd}
      starting_integral_term: ${pid_starting_integral}
      min_integral: 0.0  # Heating: error and integral term are positive
      max_integral: 1.0
      output_averaging_samples: 5
    deadband_parameters:
      threshold_high: ${pid_deadband}°C
      threshold_low: -${pid_deadband}°C
      kp_multiplier: 0.0   # No proportional reaction inside the deadband
      ki_multiplier: 0.05  # Integral keeps creeping slowly inside the deadband
      kd_multiplier: 0.0
      deadband_output_averaging_samples: 15

  - platform: pid
    id: pid_cool_embedded
    name: PID Cool
    internal: true
    sensor: temp_nspanel
    default_target_temperature: 24  # Overwritten by the sync right after boot
    cool_output: pid_cool_out
    control_parameters:
      kp: ${pid_kp}
      ki: ${pid_ki}
      kd: ${pid_kd}
      starting_integral_term: -${pid_starting_integral}
      min_integral: -1.0  # Cooling: error and integral term are negative
      max_integral: 0.0
      output_averaging_samples: 5
    deadband_parameters:
      threshold_high: ${pid_deadband}°C
      threshold_low: -${pid_deadband}°C
      kp_multiplier: 0.0
      ki_multiplier: 0.05
      kd_multiplier: 0.0
      deadband_output_averaging_samples: 15

output:
  # Both controllers feed one shared slow PWM output; only the controller of the active mode may write
  - platform: template
    id: pid_heat_out
    type: float
    write_action:
      - lambda: |-
          if (!id(pid_cooling_mode)) id(pid_valve_pwm).set_level(state);

  - platform: template
    id: pid_cool_out
    type: float
    write_action:
      - lambda: |-
          if (id(pid_cooling_mode)) id(pid_valve_pwm).set_level(state);

  - platform: slow_pwm  # Turns the controller output (0..100 %) into on/off cycles of the valve relay
    id: pid_valve_pwm
    period: ${pwm_period}s
    turn_on_action:
      - switch.turn_on: relay_${valve_relay}
    turn_off_action:
      - switch.turn_off: relay_${valve_relay}

script:
  # Copies room on/off, setpoint and operating mode from the thermostat facade to the controllers
  - id: pid_sync
    mode: queued
    then:
      - lambda: |-
          const bool room_on = (thermostat_embedded->mode == climate::CLIMATE_MODE_HEAT);
          const float target = thermostat_embedded->target_temperature;
          const bool cooling = id(pid_cooling_mode);
          const bool heat_on = room_on && !cooling;
          const bool cool_on = room_on && cooling;

          if (room_on && isnan(target)) {
            ESP_LOGW("${TAG_ADDON_CLIMATE_PID}", "Setpoint is NAN - sync skipped");
            return;
          }

          // Only calls perform() on a change, to avoid needless state publishes
          auto apply = [&](climate::Climate *pid, bool on, climate::ClimateMode on_mode) {
            const auto want = on ? on_mode : climate::CLIMATE_MODE_OFF;
            const bool target_diff = on && (isnan(pid->target_temperature) ||
                                            fabsf(pid->target_temperature - target) > 0.01f);
            if (pid->mode == want && !target_diff) return;
            auto call = pid->make_call();
            call.set_mode(want);
            if (on) call.set_target_temperature(target);
            call.perform();
          };

          // Turn the inactive controller off first, then set the active one
          if (cooling) {
            apply(pid_heat_embedded, heat_on, climate::CLIMATE_MODE_HEAT);
            apply(pid_cool_embedded, cool_on, climate::CLIMATE_MODE_COOL);
          } else {
            apply(pid_cool_embedded, cool_on, climate::CLIMATE_MODE_COOL);
            apply(pid_heat_embedded, heat_on, climate::CLIMATE_MODE_HEAT);
          }
          if (!room_on) id(pid_valve_pwm).set_level(0.0f);

  # Applies kp and Tn from the number entities to both controllers (ki = kp / Tn in seconds)
  - id: apply_pid_tuning
    mode: restart
    then:
      - lambda: |-
          ESP_LOGI("${TAG_ADDON_CLIMATE_PID}", "Tuning applied: kp=%.3f Tn=%.0fmin",
                   pid_tuning_kp->state, pid_tuning_tn->state);
      - climate.pid.set_control_parameters:
          id: pid_heat_embedded
          kp: !lambda "return pid_tuning_kp->state;"
          ki: !lambda |-
            const float tn_s = pid_tuning_tn->state * 60.0f;
            return (tn_s > 0.0f) ? pid_tuning_kp->state / tn_s : 0.0f;
      - climate.pid.set_control_parameters:
          id: pid_cool_embedded
          kp: !lambda "return pid_tuning_kp->state;"
          ki: !lambda |-
            const float tn_s = pid_tuning_tn->state * 60.0f;
            return (tn_s > 0.0f) ? pid_tuning_kp->state / tn_s : 0.0f;

interval:
  - interval: ${pid_sync_interval}s
    then:
      - script.execute: pid_sync

sensor:
  # Controller outputs and integral terms, for tuning in HA
  - platform: pid
    climate_id: pid_heat_embedded
    name: ${pid_name_heat_output}
    type: HEAT
    entity_category: diagnostic
  - platform: pid
    climate_id: pid_cool_embedded
    name: ${pid_name_cool_output}
    type: COOL
    entity_category: diagnostic
  - platform: pid
    climate_id: pid_heat_embedded
    name: ${pid_name_heat_integral}
    type: INTEGRAL
    entity_category: diagnostic
  - platform: pid
    climate_id: pid_cool_embedded
    name: ${pid_name_cool_integral}
    type: INTEGRAL
    entity_category: diagnostic

number:
  # Live tuning from HA, applied to both controllers without reflashing.
  # After the first boot these entities are the source (restore_value); the substitutions are seeds only.
  - platform: template
    id: pid_tuning_kp
    name: ${pid_name_kp}
    entity_category: config
    icon: mdi:tune-vertical
    min_value: 0.05
    max_value: 1.0
    step: 0.05
    initial_value: ${pid_kp}
    restore_value: true
    optimistic: true
    on_value:
      - script.execute: apply_pid_tuning

  - platform: template
    id: pid_tuning_tn
    name: ${pid_name_tn}
    entity_category: config
    icon: mdi:timer-cog-outline
    unit_of_measurement: min
    min_value: 10
    max_value: 600
    step: 5
    initial_value: ${pid_tn}
    restore_value: true
    optimistic: true
    on_value:
      - script.execute: apply_pid_tuning

  - platform: template
    id: pid_tuning_pwm_period
    name: ${pid_name_pwm_period}
    entity_category: config
    icon: mdi:sine-wave
    unit_of_measurement: s
    min_value: 300
    max_value: 3600
    step: 60
    initial_value: ${pwm_period}
    restore_value: true
    optimistic: true
    on_value:
      - lambda: |-
          if (isnan(x) || x < 60.0f) return;
          ESP_LOGI("${TAG_ADDON_CLIMATE_PID}", "PWM period applied: %.0fs", x);
          pid_valve_pwm->set_period((uint32_t) (x * 1000.0f));

  - platform: template
    id: pid_tuning_deadband
    name: ${pid_name_deadband}
    entity_category: config
    icon: mdi:arrow-expand-vertical
    unit_of_measurement: "°C"
    min_value: 0.0
    max_value: 1.0
    step: 0.05
    initial_value: ${pid_deadband}
    restore_value: true
    optimistic: true
    on_value:
      - lambda: |-
          if (isnan(x) || x < 0.0f) return;
          ESP_LOGI("${TAG_ADDON_CLIMATE_PID}", "Deadband applied: +/-%.2fK", x);
          pid_heat_embedded->set_threshold_high(x);
          pid_heat_embedded->set_threshold_low(-x);
          pid_cool_embedded->set_threshold_high(x);
          pid_cool_embedded->set_threshold_low(-x);

button:
  - platform: template
    name: ${pid_name_reset_integral}
    entity_category: config
    icon: mdi:restore
    on_press:
      - climate.pid.reset_integral_term: pid_heat_embedded
      - climate.pid.reset_integral_term: pid_cool_embedded

packages:
  climate_base_package: !include nspanel_esphome_addon_climate_base.yaml
...
